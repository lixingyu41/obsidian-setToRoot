name: Release Obsidian plugin

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, attest, and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read manifest version
        id: manifest
        shell: bash
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches manifest version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.manifest.outputs.version }}"
          if [[ "${tag}" != "${version}" ]]; then
            echo "Release tag '${tag}' must match manifest.json version '${version}'." >&2
            exit 1
          fi

      - name: Build plugin
        run: npm run build

      - name: Verify release assets exist
        shell: bash
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${VERSION}"
            target_args=(--target "${GITHUB_SHA}")
          else
            tag="${GITHUB_REF_NAME}"
            target_args=()
          fi

          gh release create "${tag}" \
            "${target_args[@]}" \
            --title "${VERSION}" \
            --generate-notes \
            main.js manifest.json styles.css

name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read manifest version
        id: manifest
        run: |
          version="$(node -p "require('./manifest.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches manifest version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${{ steps.manifest.outputs.version }}"
          if [ "${tag}" != "${version}" ]; then
            echo "Release tag '${tag}' must match manifest.json version '${version}'." >&2
            exit 1
          fi

      - name: Build plugin
        run: npm run build

      - name: Verify release assets
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Write release notes
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          ## Set to Root ${VERSION}

          This release contains the Obsidian plugin build artifacts for version ${VERSION}.

          ### Included assets
          - \`main.js\`: bundled plugin entry point
          - \`manifest.json\`: plugin metadata
          - \`styles.css\`: plugin styles

          GitHub artifact attestations are generated for each release asset so users can verify the assets were built from this repository.
          EOF_NOTES

      - name: Generate main.js artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: main.js

      - name: Generate manifest.json artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: manifest.json

      - name: Generate styles.css artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${VERSION}"
            target_args="--target ${GITHUB_SHA}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            target_args=""
          fi

          gh release create "$tag" \
            $target_args \
            --title="$tag" \
            --notes-file=release-notes.md \
            main.js manifest.json styles.css
